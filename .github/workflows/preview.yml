# Plan § 3 and § 4: save the digest page and put it on GitHub Pages, never in git (ADR 0003).
# The lane marker comes from the repo secret LANE_MARKER. Clean-up: delete the secret, run again.
name: preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/save-preview.sh 2026-10-28 _site/index.html
        env:
          LANE_MARKER: ${{ secrets.LANE_MARKER }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
